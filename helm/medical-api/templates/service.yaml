apiVersion: v1
kind: Service

metadata:
  name: {{ include "medical-api.fullname" . }}
  labels:
    {{- include "medical-api.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "medical-api.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}