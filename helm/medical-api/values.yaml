replicaCount: 1

image:
  repository: medical-api
  tag: "1.0.2"
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

config:
  appName: "Medical Appointment API"
  environment: "development"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 3
    periodSeconds: 5

  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60