apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medical-api
  namespace: medical-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medical-api

  minReplicas: 1
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60